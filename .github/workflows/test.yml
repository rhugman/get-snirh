name: Tests

# Offline test suite only: live tests in tests/test_live.py are skipped
# unless RUN_LIVE_TESTS=1 (see live-drift.yml for the scheduled live run).
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Test on Ubuntu (fastest/standard) and Windows (to catch path/encoding issues)
        os: [ubuntu-latest, windows-latest]
        # Oldest tested, current stable, and newest. 3.14 is what
        # environment.yml resolves to today and brings pandas 3.x with it —
        # a major version ahead of the rest. Without it, the pandas>=2.0.0
        # floor in pyproject.toml (which has no upper bound) is a claim
        # nothing checks.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      # 'pip install -e .' pulls runtime deps (pandas, requests,
      # beautifulsoup4, urllib3) from pyproject.toml.
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Show resolved versions
      # The matrix exists to catch dependency drift, so record what pip
      # actually resolved rather than what the floors permit.
      run: |
        python -c "import sys, pandas, bs4, urllib3; print('python  ', sys.version.split()[0]); print('pandas  ', pandas.__version__); print('bs4     ', bs4.__version__); print('urllib3 ', urllib3.__version__)"

    - name: Run offline test suite
      run: |
        pytest
