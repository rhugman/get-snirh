name: Tests

# Offline test suite only: live tests in tests/test_live.py are skipped
# unless RUN_LIVE_TESTS=1 (see live-drift.yml for the scheduled live run).
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Test on Ubuntu (fastest/standard) and Windows (to catch path/encoding issues)
        os: [ubuntu-latest, windows-latest]
        # Test oldest supported (modern) and newest stable
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and test dependencies
      # 'pip install -e .' pulls runtime deps (pandas, requests,
      # beautifulsoup4, urllib3) from pyproject.toml.
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    - name: Run offline test suite
      run: |
        pytest
