name: Live drift

# Weekly check that SNIRH itself has not drifted (page layout, endpoints,
# encodings). Runs the gated live suite in tests/test_live.py (~57 sequential
# HTTP requests). Schedule + manual dispatch ONLY — never on push/PR, to be
# polite to SNIRH.
#
# KNOWN LIMITATION — this workflow switches itself off when the repo is quiet.
# GitHub disables a scheduled workflow after 60 days of repository inactivity,
# and only new commits reset that clock: issues, pull requests, releases and
# this workflow's own runs do not count. Disabling applies to the whole file,
# so workflow_dispatch stops working too — the run button simply will not fire.
# It is not loud: GitHub emails the maintainer, and nothing else says the
# alarm has stopped.
#
# So on a stable release, expect the drift check to lapse ~2 months after the
# last commit. That is accepted: the alternative is a bot pushing empty
# commits to manufacture activity, which is not worth the noise in history.
# After any quiet spell, assume this is off and check.
#
# Re-enable with:  gh workflow enable live-drift.yml
# Check state with: gh api repos/rhugman/get-snirh/actions/workflows \
#                     --jq '.workflows[] | {name, state}'
# ('disabled_inactivity' is the state to look for; .github/workflows/test.yml
# was found sitting in it in July 2026, silently taking its pull_request
# trigger down with it.)
on:
  schedule:
    # Mondays 06:17 UTC — offset from the top of the hour to avoid the
    # GitHub Actions scheduling stampede.
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Overlapping runs (e.g. a manual dispatch during the weekly run, or a
# hung previous run) must not double the load on SNIRH.
concurrency:
  group: live-drift
  cancel-in-progress: true

# The alert step opens/closes a tracking issue when CI is blind (see below).
permissions:
  contents: read
  issues: write

jobs:
  live-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install package and test dependencies
      # 'pip install -e .' pulls runtime deps (pandas, requests,
      # beautifulsoup4, urllib3) from pyproject.toml.
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .

    # SNIRH blocks non-Portuguese IPs (403), so from a GitHub-hosted runner the
    # live suite would just skip and the job would go green — blind. Probe once
    # up front so we can distinguish "unreachable, no coverage" (alert, don't
    # run) from "reachable" (run; failures are genuine drift).
    - name: Probe SNIRH reachability
      id: probe
      run: |
        python - <<'PY'
        import os
        from get_snirh import SnirhClient
        from get_snirh.constants import SnirhUrls
        from get_snirh.exceptions import SnirhNetworkError
        try:
            SnirhClient().get(SnirhUrls.HOME)
            state = "reachable"
        except SnirhNetworkError as exc:
            state = "unreachable"
            print(f"::warning::SNIRH unreachable from CI — no drift coverage this run: {exc}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"state={state}\n")
        PY

    - name: Run live drift suite (sequential requests)
      if: steps.probe.outputs.state == 'reachable'
      run: |
        RUN_LIVE_TESTS=1 python -m pytest tests/test_live.py -v

    # Keep exactly one open tracking issue while CI is blind, so a permanent
    # green-but-blind check can't silently hide drift; close it on recovery.
    - name: Alert — CI blind (SNIRH unreachable)
      if: steps.probe.outputs.state == 'unreachable'
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/drift-blind-alert.sh open

    - name: Resolve alert — SNIRH reachable again
      if: steps.probe.outputs.state == 'reachable'
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/drift-blind-alert.sh close
