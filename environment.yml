name: get-snirh-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Runtime floors mirror pyproject.toml. pandas>=2.0 is not cosmetic: data.py
  # uses pd.read_csv(date_format=...), which 1.x does not have.
  - python>=3.8
  - pandas>=2.0.0
  - requests>=2.25.0
  - beautifulsoup4>=4.12
  - urllib3>=1.26
  # Development and examples.
  - pytest
  - ipykernel
  - matplotlib>=3.5      # examples/ notebooks only, not a package dependency
  - pip
  - pip:
    - -e .
